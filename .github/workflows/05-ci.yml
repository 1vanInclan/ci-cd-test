name: 05 - CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:

  frontend-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Instalar dependencias
        run: |
          echo "::group::Instalar dependencias"
          pnpm install
      
      - name: Lint
        run: |
          echo "::group::Lint"
          pnpm lint:frontend

  frontend-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Instalar dependencias
        run: |
          echo "::group::Instalar dependencias"
          pnpm install
      
      - name: Test
        run: |
          echo "::group::Test"
          pnpm test:frontend

  ci:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      
      - name: Instalar dependencias
        run: pnpm install

      - name: Lint
        run: pnpm lint
      
      - name: Test
        run: pnpm test
      
      - name: Build
        run: pnpm build
      
  backend-lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Instalar dependencias
        run: |
          echo "::group::Instalar dependencias"
          pnpm install

      - name: Lint
        run: |
          echo "::group::Lint"
          pnpm lint:backend

  backend-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Preparar pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false

      - name: Instalar dependencias
        run: |
          echo "::group::Instalar dependencias"
          pnpm install
      
      - name: Test
        run: |
          echo "::group::Test"
          pnpm test:backend